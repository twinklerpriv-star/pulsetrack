[project]
name = "pulsetrack"
version = "0.1.0"
description = "A modern, lightweight, privacy-friendly Web-Analytics tracker and dashboard."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "jinja2>=3.1.2",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.0",
    "argon2-cffi>=23.1.0",
    "pytest-asyncio>=0.21.0",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C90"]
ignore = ["E501", "C901", "B008", "B904", "E402", "N806", "F841"]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
