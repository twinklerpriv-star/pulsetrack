# ==============================================================================
# PULSETRACK ANALYTICS - CONTAINER-ORCHESTRIERUNG (DOCKER COMPOSE)
# ==============================================================================
# Datum: 01.06.2026 | Version: 1.2 | Status: Produktionsbereit
#
# BETRIEBSWIRTSCHAFTLICHER ZWECK DIESER DATEI:
# Diese Datei ermöglicht es Ihrem IT-Techniker, das gesamte PulseTrack-System
# mit einem einzigen Befehl zu starten oder zu stoppen. Sie orchestriert zwei
# getrennte Services: die Haupt-Engine und das Echtzeit-Backup-System (Litestream).
#
# BEDIENUNG DURCH DEN IT-TECHNIKER:
#   docker compose up -d            → Gesamtes System lautlos im Hintergrund starten
#   docker compose down             → Gesamtes System stoppen (Daten bleiben erhalten)
#   docker compose logs -f          → Echtzeit-Protokolle einsehen
# ==============================================================================

services:
  # 1. DER ANALYTICS CORE-DIENST
  # Das Herzstück von PulseTrack, das die Dashboard-Oberfläche bereitstellt und
  # die Ingestion-Hits der Webseitenbesucher empfängt.
  analytics:
    build: .
    container_name: pulsetrack
    restart: unless-stopped  # Startet den Server bei einem Absturz automatisch neu

    ports:
      - "8000:8000"  # Leitet Port 8000 vom Server in den Container weiter

    volumes:
      # PERSISTENTES VOLUMEN (DATEN-TRESOR):
      # Dies stellt sicher, dass Ihre SQLite-Datenbankdatei sicher auf der Festplatte
      # des echten Servers liegt und bei Updates oder Neustarts niemals verloren geht.
      - analytics_data:/data

    environment:
      # KRYPTOGRAFISCHE GEHEIMNISSE (Über die Systemumgebung eingespeist):
      # ANALYTICS_SALT_SECRET: Der geheime Schlüssel zur IP-Anonymisierung
      - ANALYTICS_SALT_SECRET=${ANALYTICS_SALT_SECRET:-change-me-in-production}
      - ANALYTICS_DB_PATH=/data/analytics.db
      
      # STRIPE LIZENZ- & ZAHLUNGSDATEN:
      # Ermöglicht dem System die automatische Abo-Verifizierung
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_PRICE_STARTER=${STRIPE_PRICE_STARTER}
      - STRIPE_PRICE_BUSINESS=${STRIPE_PRICE_BUSINESS}
      - STRIPE_PRICE_ENTERPRISE=${STRIPE_PRICE_ENTERPRISE}

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 2. DAS LITESTREAM ECHTZEIT-BACKUP (SIDECAR)
  # Ein genialer Schutz für Ihre SQLite-Datenbank: Litestream liest die Datenbank
  # fortlaufend mit und streamt jede kleine Änderung (Transaktion) im selben Moment
  # verschlüsselt in Ihren S3-Cloud-Speicher (z.B. AWS S3 oder Cloudflare R2).
  # VORTEIL FÜR DEN GESCHÄFTSFÜHRER:
  # Selbst wenn Ihr Server vollständig zerstört wird (z. B. durch einen Brand im Rechenzentrum),
  # sind Ihre Besucherstatistiken bis zur allerletzten Sekunde sicher in der Cloud gesichert!
  litestream:
    image: litestream/litestream:latest
    container_name: pulsetrack_backup
    restart: unless-stopped
    depends_on:
      - analytics
    volumes:
      - analytics_data:/data
      - ./litestream.yml:/etc/litestream.yml
    environment:
      - LITESTREAM_ACCESS_KEY_ID=${LITESTREAM_ACCESS_KEY_ID}
      - LITESTREAM_SECRET_ACCESS_KEY=${LITESTREAM_SECRET_ACCESS_KEY}
      - LITESTREAM_BUCKET=${LITESTREAM_BUCKET}
      - LITESTREAM_REGION=${LITESTREAM_REGION}
      - LITESTREAM_ENDPOINT=${LITESTREAM_ENDPOINT}
    command: replicate -config /etc/litestream.yml

volumes:
  # Physisches Speicher-Verzeichnis definieren
  analytics_data:
    driver: local
