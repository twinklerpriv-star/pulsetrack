# Docker Compose: PulseTrack
# Datum: 20.05.2026 | Version: 1.0 | Status: Produktionsbereit
#
# Verwendung:
#   docker compose up -d            → Container starten
#   docker compose down             → Container stoppen
#   docker compose logs -f          → Logs verfolgen

services:
  analytics:
    build: .
    container_name: pulsetrack
    restart: unless-stopped

    ports:
      - "8000:8000"

    volumes:
      # Persistente Datenbank: bleibt auch nach Container-Neustart erhalten
      - analytics_data:/data

    environment:
      # WICHTIG: In Produktion durch ein sicheres, zufälliges Secret ersetzen!
      - ANALYTICS_SALT_SECRET=${ANALYTICS_SALT_SECRET:-change-me-in-production}
      - ANALYTICS_DB_PATH=/data/analytics.db
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_PRICE_STARTER=${STRIPE_PRICE_STARTER}
      - STRIPE_PRICE_BUSINESS=${STRIPE_PRICE_BUSINESS}
      - STRIPE_PRICE_ENTERPRISE=${STRIPE_PRICE_ENTERPRISE}

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Litestream Sidecar-Container für S3-Replikation (Ausfallsicherheit & Disaster Recovery)
  litestream:
    image: litestream/litestream:latest
    container_name: pulsetrack_backup
    restart: unless-stopped
    depends_on:
      - analytics
    volumes:
      - analytics_data:/data
      - ./litestream.yml:/etc/litestream.yml
    environment:
      - LITESTREAM_ACCESS_KEY_ID=${LITESTREAM_ACCESS_KEY_ID}
      - LITESTREAM_SECRET_ACCESS_KEY=${LITESTREAM_SECRET_ACCESS_KEY}
      - LITESTREAM_BUCKET=${LITESTREAM_BUCKET}
      - LITESTREAM_REGION=${LITESTREAM_REGION}
      - LITESTREAM_ENDPOINT=${LITESTREAM_ENDPOINT}
    command: replicate -config /etc/litestream.yml

volumes:
  analytics_data:
    driver: local
